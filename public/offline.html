<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Family Electronics Maintenance — Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #fff7ed;
        color: #1c1917;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 360px;
      }
      h1 {
        font-size: 1.25rem;
        margin-bottom: 8px;
        color: #ea580c;
      }
      p {
        margin: 0 0 16px;
        color: #57534e;
        line-height: 1.5;
      }
      button {
        background: #ea580c;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        font-size: 0.95rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>
        Family Electronics Maintenance can't reach the network right now.
        This is just a temporary connection issue — you have not been
        logged out. Reconnect and try again.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
